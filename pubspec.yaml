name: orbit_3d_flutter
description: 3D Orbit Visualization Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.6.0
  video_player: ^2.9.5
  xml: ^6.5.0
  just_audio: ^0.9.44
  cached_network_image: ^3.4.0
  flutter_local_notifications: ^19.5.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

