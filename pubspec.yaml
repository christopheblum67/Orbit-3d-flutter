name: orbit_3d_flutter
description: 3D Orbit Visualization Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.6.0
  video_player: ^2.14.0
  url_launcher: ^6.3.1
  xml: ^7.0.1
  collection: ^1.18.0
  just_audio: ^0.10.6
  cached_network_image: ^4.0.0
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1
  device_info_plus: ^13.2.0
  connectivity_plus: ^7.3.1
  speech_to_text: ^7.4.0
  vector_math: ^2.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    # .env embarqué : clé partagée TMDB_API_KEY (Option A) lue par dotenv au
    # boot. Fichier gitignoré : la clé ne part jamais sur le repo.
    - .env

# Icônes du lanceur Android + bannière Android TV (Leanback). Nécessite des
# fichiers rectangulaires préparés :
#   - assets/icons/app_icon.png  (1024x1024, symbole centré, fond transparent)
#   - assets/icons/tv_banner.png (320x180, bandeau Leanback)
# Génération : `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  banner_image_path: "assets/icons/tv_banner.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

