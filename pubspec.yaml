name: orbit_3d_flutter
description: 3D Orbit Visualization Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.4
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.3
  uuid: ^4.6.0
  video_player: ^2.14.0
  url_launcher: ^6.3.1
  xml: ^7.0.1
  collection: ^1.18.0
  just_audio: ^0.10.6
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1
  device_info_plus: ^13.1.0
  connectivity_plus: ^7.3.1
  vector_math: ^2.1.4
  home_widget: ^0.9.4
  cast: ^2.1.0
  bonsoir: ^7.1.3
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_localizations:
    sdk: flutter
  firebase_crashlytics: ^5.4.0

  crypto: any
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^10.3.4
  dio_cookie_manager: ^3.1.1
  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android
  cast:
    path: third_party/cast

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    # .env embarqué : clé partagée TMDB_API_KEY (Option A) lue par dotenv au
    # boot. Fichier gitignoré : la clé ne part jamais sur le repo.
    - .env

# Icônes du lanceur Android + bannière Android TV (Leanback).
# Masters committés sous `assets/icons/` :
#   - app_icon.png            (1024x1024, icône pleine, fond #0F172A opaque)
#   - app_icon_foreground.png (1024x1024, motif seul, fond transparent)
# La bannière TV reste écrite à la main dans `android/app/src/main/res/`.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  # `banner_image_path` est volontairement absent : la bannière TV est écrite à
  # la main (`res/drawable/tv_banner.xml` + `res/drawable-nodpi/tv_banner.png`).
  # Laisser le plugin générer `res/drawable/tv_banner.png` entrerait en
  # collision de ressource avec le XML et casserait le build.
  # Les mipmaps/foregrounds committés sous `android/app/src/main/res/` sont ceux
  # générés depuis ces deux masters (plugin non requis au build).

