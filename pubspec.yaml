name: orbit_3d_flutter
description: 3D Orbit Visualization Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.6.0
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  xml: ^6.5.0
  collection: ^1.18.0
  just_audio: ^0.9.44
  cached_network_image: ^3.4.0
  flutter_local_notifications: ^19.5.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1
  device_info_plus: ^13.2.0
  connectivity_plus: ^7.3.1
  speech_to_text: ^7.4.0
  vector_math: ^2.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    # .env embarqué : clé partagée TMDB_API_KEY (Option A) lue par dotenv au
    # boot. Fichier gitignoré : la clé ne part jamais sur le repo.
    - .env

