pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.1" apply false
    // Flutter 3.47.2 exige KGP >= 2.2.20 ; le Kotlin integre d'AGP 9.1.1 est en
    // 2.2.10. On declare donc KGP explicitement (applique par le plugin Gradle
    // Flutter car `android.builtInKotlin=false`). Version alignee sur le
    // template Flutter 3.47.2 (2.4.0), validee avec Gradle 9.3.1 / AGP 9.1.
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false

}

include ":app"
