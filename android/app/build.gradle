plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Identifiants de signature release (android/key.properties, gitignoré).
// Sans ce fichier, le build sort en clé DEBUG : installable mais refusé par le
// Play Store, et non re-signable en production.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.orbit_3d_flutter"
    // AndroidX (window/fragment/activity) poussés par les plugins natifs
    // exigent compileSdk >= 35 ; on verrouille sur 36 (platform installée).
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "orbit.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile']
                ? file(keystoreProperties['storeFile'])
                : null
            storePassword = keystoreProperties['storePassword']
            // APK Signature Scheme v3 : permet la rotation de clé (proof-of-rotation),
            // exigée par les stores pour les nouvelles clés. v2 conservé pour
            // compatibilité appareils anciens.
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            // Signature release réelle (upload-keystore.jks). En l'absence de
            // android/key.properties, le build échoue au lieu de sortir
            // silencieusement une APK signée debug.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
