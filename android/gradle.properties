org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47 supports built-in Kotlin with AGP 9.1+; keep the legacy
# Kotlin plugin mode until all Android plugins have been migrated.
android.builtInKotlin=false
# Keep the legacy AGP DSL until all Android plugins support the new DSL.
android.newDsl=false
