org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Deprecie en AGP 9 (defaut `false`), retire en AGP 10 : on suit le defaut.
# Verifie par A/B (intermediaires purges) : aucune acceleration mesurable
# (92,5 s contre 94,1 s, soit du bruit) ; le justificatif est la depreciation.
# Sursite verifiee : le build passe et aucun `android.support.*` n'est
# reference par les classes de l'APK (cf. verification de la release).
android.enableJetifier=false
# Built-in Kotlin AGP 9.0.1 embarque KGP 2.2.10, trop vieux pour Flutter
# 3.47.2 (min 2.2.20) : on force la version via le plugin Kotlin explicite
# dans settings.gradle. Migration vers built-in Kotlin nécessite AGP ≥ 9.1
# ou Flutter ≥ 3.48+.
android.builtInKotlin=true
# Opt-out of the new AGP DSL (Flutter Gradle plugin 3.47 reads legacy DSL)
android.newDsl=false
