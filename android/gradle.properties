org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Opt-out built-in Kotlin: plugins natifs (bonsoir_android, firebase, ...) appliquent encore KGP.
# AGP 10 forcera le built-in : a migrer apres upgrade des plugins.
android.builtInKotlin=false
# Opt-out of the new AGP DSL (Flutter Gradle plugin 3.47 reads legacy DSL)
android.newDsl=false
