org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Opt-out built-in Kotlin: AGP 9.0.1 embarque KGP 2.2.10, trop vieux
# pour Flutter 3.47.2 (min 2.2.20). Migration vers built-in Kotlin
# nécessite AGP ≥ 9.1 ou Flutter ≥ 3.48+.
android.builtInKotlin=false
# Opt-out of the new AGP DSL (Flutter Gradle plugin 3.47 reads legacy DSL)
android.newDsl=false
