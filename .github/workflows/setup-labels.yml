name: Créer les labels de triage

on:
  push:
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    name: Création/mise à jour des labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer les labels depuis labels.yml
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('.github/labels.yml', 'utf8');

            // Parse simple du YAML (liste de - name/description/color)
            const labels = [];
            const lines = content.split(/\r?\n/);
            let current = null;
            for (const line of lines) {
              if (/^-\s*name:/.test(line)) {
                if (current) labels.push(current);
                current = {};
                current.name = line.replace(/^-\s*name:\s*/, '').trim().replace(/^['"]|['"]$/g, '');
              } else if (/^\s*description:/.test(line)) {
                if (current) current.description = line.replace(/^\s*description:\s*/, '').trim().replace(/^['"]|['"]$/g, '');
              } else if (/^\s*color:/.test(line)) {
                if (current) current.color = line.replace(/^\s*color:\s*/, '').trim();
              }
            }
            if (current) labels.push(current);

            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            for (const label of labels) {
              const data = { ...repo, name: label.name, color: label.color, description: label.description || '' };
              try {
                await github.rest.issues.createLabel({ ...data, name: label.name });
                console.log(`Créé: ${label.name}`);
              } catch (e) {
                if (e.status === 422) {
                  await github.rest.issues.updateLabel({
                    owner: repo.owner,
                    repo: repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description || ''
                  });
                  console.log(`Mis à jour: ${label.name}`);
                } else {
                  console.error(`Erreur ${label.name}: ${e.message}`);
                }
              }
            }
            console.log(`Total: ${labels.length} labels traités`);
