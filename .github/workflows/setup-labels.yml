name: Créer les labels de triage

on:
  push:
    paths:
      - '.github/labels.yml'
      - '.github/workflows/setup-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    name: Création/mise à jour des labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer les labels depuis labels.yml
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: false
