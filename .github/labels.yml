# Labels de criticité (triage des bugs)
- name: "criticality:critique"
  description: 🔴 Bloquant - crash ou app inutilisable
  color: "b60205"
- name: "criticality:eleve"
  description: 🟠 Fonction majeure en panne
  color: "d93f0b"
- name: "criticality:moyen"
  description: 🟡 Fonction partielle / gêne non bloquante
  color: "fbca04"
- name: "criticality:faible"
  description: 🟢 Détail d'interface ou mineur
  color: "0e8a16"

